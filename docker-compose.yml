version: '3.8'

services:
  vdatadao-proof:
    build: .
    container_name: vdatadao-proof-app
    volumes:
      # Mount input/output directories for LOCAL TESTING (TEE production uses /input directly)
      - ./demo/input:/input:ro
      - ./output:/output:rw
    environment:
      - DOCKER_CONTAINER=true
      # PostgreSQL Configuration
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-vdatadao_proof}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Application Configuration
      - GOOGLE_TOKEN=${GOOGLE_TOKEN:-}
      - DLP_ID=${DLP_ID:-143}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    working_dir: /app
    
    # Health check to verify PostgreSQL connectivity
    healthcheck:
      test: ["CMD", "python", "-c", "from my_proof.utils.db import DataRegistry; DataRegistry()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s